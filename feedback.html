<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub - Feedback</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #FBE3BE;
    font-family: Arial, Helvetica, sans-serif;
    color: #1a1a1a;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    font-size: 14px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background-color: #7C8363;
    border-radius: 50%;
  }

  nav {
    display: flex;
    gap: 30px;
  }

  nav a {
    text-decoration: none;
    color: #1a1a1a;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #3B6FE0;
  }

  .feedback-box {
    background-color: #ffffff;
    max-width: 560px;
    margin: 40px auto;
    padding: 40px;
    border-radius: 16px;
  }

  .feedback-box h1 {
    font-size: 26px;
    margin-bottom: 24px;
  }

  .feedback-box label {
    display: block;
    font-size: 14px;
    margin-bottom: 12px;
  }

  .stars {
    font-size: 30px;
    color: #cccccc;
    margin-bottom: 24px;
    letter-spacing: 6px;
  }

  textarea {
    width: 100%;
    height: 180px;
    background-color: #d9d9d9;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    resize: vertical;
  }

  .submit-btn {
    margin-top: 20px;
    background-color: #F6C892;
    border: none;
    border-radius: 20px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  footer {
    text-align: center;
    padding: 20px 0 40px;
    font-size: 15px;
  }

  footer a {
    color: #4B3FBB;
    text-decoration: none;
    margin: 0 6px;
  }

  footer a.active {
    font-weight: bold;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    STUDENT HUB
  </div>
  <nav>
    <a href="index.html">home</a>
    <a href="courses.html">courses</a>
    <a href="events.html">events</a>
    <a href="about.html">about</a>
    <a href="library.html">library</a>
  </nav>
  <div class="avatar"></div>
</header>

<div class="feedback-box">
  <h1>WE VALUE YOUR FEEDBACK</h1>
  <label>HOW WOULD YOU RATE THE OVERALL EXPERIENCE?</label>
  <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
  <label>KINDLY TAKE A MOMENT TO TELL US WHAT YOU THINK</label>
  <textarea></textarea>
  <br>
  <button class="submit-btn">SUBMIT</button>
</div>

<footer>
  <a href="faq.html">FAQ</a> | <a href="contact.html">CONTACT US</a> | <a href="feedback.html" class="active">FEEDBACK</a>
</footer>

</body>
</html>
