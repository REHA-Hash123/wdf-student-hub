<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub - Events</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #FBE3BE;
    font-family: Arial, Helvetica, sans-serif;
    color: #1a1a1a;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    font-size: 14px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background-color: #7C8363;
    border-radius: 50%;
  }

  nav {
    display: flex;
    gap: 30px;
  }

  nav a {
    text-decoration: none;
    color: #1a1a1a;
  }

  nav a.active {
    font-weight: bold;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #3B6FE0;
  }

  h1.page-title {
    text-align: center;
    padding: 60px 20px 20px;
    font-size: 36px;
  }

  p.page-intro {
    text-align: center;
    font-size: 16px;
    max-width: 500px;
    margin: 0 auto 40px;
    color: #444444;
  }

  /* ---- Controls: search / category / sort ---- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    max-width: 800px;
    margin: 0 auto 24px;
    padding: 0 20px;
  }

  .controls input,
  .controls select {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 16px;
    border: 2px solid #7C8363;
    border-radius: 6px;
    background-color: #FFF8ED;
    color: #1a1a1a;
  }

  .controls input:focus,
  .controls select:focus {
    outline: 3px solid #3B6FE0;
    outline-offset: 1px;
  }

  #search-input {
    flex: 1 1 240px;
    min-width: 200px;
  }

  #category-filter,
  #sort-select {
    flex: 0 1 200px;
  }

  .results-count {
    text-align: center;
    font-size: 14px;
    color: #5C6349;
    max-width: 800px;
    margin: 0 auto 20px;
    min-height: 18px;
  }

  /* ---- Event list: ticket-stub rows ---- */

  .events-list {
    max-width: 800px;
    margin: 0 auto 20px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
  }

  .event-row {
    display: flex;
    gap: 20px;
    padding: 20px 0;
    border-top: 2px dashed #C9A879;
  }

  .events-list .event-row:first-child {
    border-top: 2px dashed #C9A879;
  }

  .event-date {
    flex: 0 0 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #7C8363;
    color: #FBE3BE;
    border-radius: 8px;
    padding: 10px 0;
    height: fit-content;
  }

  .event-date-month {
    font-size: 12px;
    letter-spacing: 1px;
  }

  .event-date-day {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    line-height: 1.1;
  }

  .event-body {
    flex: 1;
    min-width: 0;
  }

  .event-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }

  .event-title {
    font-size: 19px;
    margin: 0;
  }

  .event-tag {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    color: #FFF8ED;
    white-space: nowrap;
  }

  .event-tag--workshop { background-color: #7C8363; }
  .event-tag--webinar { background-color: #3B6FE0; }
  .event-tag--seminar { background-color: #4B3FBB; }
  .event-tag--campus { background-color: #C1662F; }
  .event-tag--career { background-color: #B08300; }

  .event-meta {
    font-size: 14px;
    color: #5C6349;
    margin-bottom: 6px;
  }

  .event-desc {
    font-size: 15px;
    color: #333333;
    max-width: 65ch;
  }

  .empty-state {
    text-align: center;
    font-size: 16px;
    color: #444444;
    max-width: 500px;
    margin: 0 auto 40px;
    padding: 0 20px;
  }

  .load-more-wrap {
    text-align: center;
    margin: 10px auto 60px;
  }

  #load-more-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background-color: #7C8363;
    color: #FBE3BE;
    cursor: pointer;
  }

  #load-more-btn:hover {
    background-color: #6b7256;
  }

  #load-more-btn:focus-visible {
    outline: 3px solid #3B6FE0;
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .event-row {
      gap: 14px;
    }
    .event-date {
      flex-basis: 52px;
    }
  }

  footer {
    text-align: center;
    padding: 20px 0 40px;
    font-size: 15px;
  }

  footer a {
    color: #4B3FBB;
    text-decoration: none;
    margin: 0 6px;
  }
</style>
</head>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    STUDENT HUB
  </div>
  <nav>
    <a href="index.html">home</a>
    <a href="courses.html">courses</a>
    <a href="events.html" class="active">events</a>
    <a href="about.html">about</a>
    <a href="library.html">library</a>
  </nav>
  <div class="avatar"></div>
</header>

<h1 class="page-title">UPCOMING EVENTS</h1>
<p class="page-intro">Workshops, webinars, and campus activities — search, filter, and sort to find what's next.</p>

<section class="controls" aria-label="Filter events">
  <input type="text" id="search-input" placeholder="Search events…" aria-label="Search events">
  <select id="category-filter" aria-label="Filter by category">
    <option value="all">All categories</option>
  </select>
  <select id="sort-select" aria-label="Sort events">
    <option value="date-asc">Date: soonest first</option>
    <option value="date-desc">Date: latest first</option>
    <option value="title-asc">Title: A–Z</option>
    <option value="title-desc">Title: Z–A</option>
  </select>
</section>

<p id="results-count" class="results-count"></p>

<section id="events-list" class="events-list" aria-live="polite"></section>

<p id="empty-state" class="empty-state" hidden>No events match your search. Try a different keyword or filter.</p>

<div class="load-more-wrap" id="load-more-wrap">
  <button id="load-more-btn" type="button" hidden>Show more events</button>
</div>
