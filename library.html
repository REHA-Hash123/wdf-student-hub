<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub - Library</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #FBE3BE;
    font-family: Arial, Helvetica, sans-serif;
    color: #1a1a1a;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    font-size: 14px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background-color: #7C8363;
    border-radius: 50%;
  }

  nav {
    display: flex;
    gap: 30px;
  }

  nav a {
    text-decoration: none;
    color: #1a1a1a;
  }

  nav a.active {
    font-weight: bold;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #3B6FE0;
  }

  .library-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 50px;
    gap: 40px;
    flex-wrap: wrap;
  }

  .library-text {
    flex: 1;
    min-width: 300px;
  }

  .library-text h1 {
    font-size: 40px;
    line-height: 1.2;
    margin-bottom: 30px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    background-color: #ffffff;
    border-radius: 40px;
    max-width: 500px;
    overflow: hidden;
  }

  .search-bar input {
    border: none;
    outline: none;
    flex: 1;
    padding: 18px 22px;
    font-size: 16px;
  }

  .search-bar button {
    background-color: #7C8363;
    border: none;
    padding: 18px 24px;
    cursor: pointer;
    font-size: 16px;
  }

  .library-image img {
    width: 320px;
    max-width: 100%;
  }

  footer {
    text-align: center;
    padding: 20px 0 40px;
    font-size: 15px;
  }

  footer a {
    color: #4B3FBB;
    text-decoration: none;
    margin: 0 6px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    STUDENT HUB
  </div>
  <nav>
    <a href="index.html">home</a>
    <a href="courses.html">courses</a>
    <a href="events.html">events</a>
    <a href="about.html">about</a>
    <a href="library.html" class="active">library</a>
  </nav>
  <div class="avatar"></div>
</header>

<div class="library-section">
  <div class="library-text">
    <h1>SEARCH THE<br>BOOK YOU WANT</h1>
    <div class="search-bar">
      <input type="text" placeholder="NAME OR AUTHOR OF BOOK">
      <button type="submit">&#8594;</button>
    </div>
  </div>
  <div class="library-image">
    <img src="LIBRARY.png" alt="Stack of books">
  </div>
</div>

<footer>
  <a href="faq.html">FAQ</a> | <a href="contact.html">CONTACT US</a> | <a href="feedback.html">FEEDBACK</a>
</footer>

</body>
</html>
